quarkus.application.name=dcv-controller

# Defaults for a local run; docker-compose supplies BROKER_URL, JDBC_URL, JDBC_USER,
# JDBC_PASSWORD, CONTROL_SECONDS, OPEN_ABOVE_PPM and CLOSE_BELOW_PPM as environment
# variables, which MicroProfile Config maps onto these names.
broker.url=tcp://localhost:1883
jdbc.user=ventilation
jdbc.password=ventilation

# One second: the inner loop, matching the co2-sensor sample interval.
control.seconds=1

# The hysteresis band, against the 1000 ppm comfort limit fixed in Topology.
open.above.ppm=800
close.below.ppm=650

# jdbc.url is deliberately absent. Unset means "publish but do not journal", so the
# evaluation harness can run the loop without a database.
