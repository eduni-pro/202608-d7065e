# Broker for the supervisory loop. No authentication: the deployment is a single Compose network
# on one laptop with every port bound to loopback.
#
# Persistence is on below, and it is inert for this system by design rather than by accident. Every
# client here connects with a clean session and a randomised client id (MqttAdapter), and nothing
# publishes retained messages, so the broker has no session to restore and no backlog to replay. A
# restart therefore loses in-flight messages exactly as ADR-0002 accepts, rather than resurrecting
# stale readings a monitor would treat as fresh. What the setting does buy is that the broker's own
# restart is not a reconfiguration, which keeps the file honest about what is enabled.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
# log_dest stdout
log_type warning
log_type error
