e="text-anchor:middle;font-size:16px"><tspan x="475" dy="0">Ventilation Fault Detection, Diagnosis</tspan><tspan x="475" dy="16.833333">and Graceful Degradation</tspan><tspan x="475" dy="16.833333">[Software System]</tspan><tspan x="475" dy="16.833333">Controls ventilation in six rooms, decides</tspan><tspan x="475" dy="16.833333">whether its own equipment still works,</tspan><tspan x="475" dy="16.833333">and survives the faults it finds</tspan></text></g><g class="YnM="><g class="shape" ><rect x="322" y="747" width="306" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="475" y="785.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="475" dy="0">BuildSim</tspan><tspan x="475" dy="17.25">[Software System]</tspan><tspan x="475" dy="17.25">Building state: rooms, sensor values,</tspan><tspan x="475" dy="17.25">actuator state, 3D viewer, alerts</tspan></text></g><g class="KG9jYyAtJmd0OyBzeXMpWzBd"><marker id="mk-d2-2004455164-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 730 229 L 730 358 S 730 368 720 368 L 570 368 S 560 368 560 378 L 560 404" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2004455164-3488378134)" mask="url(#d2-2004455164)" /><text x="696" y="374" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">raise CO2 (via the simulated building)</text></g><g class="KHN5cyAtJmd0OyB0ZWNoKVswXQ=="><path d="M 391 406 L 391 378 S 391 368 381 368 L 187.5 368 S 177.5 368 177.5 358 L 177.5 277 S 177.5 267 187.5 267 L 284.833008 267 S 294.833008 267 294.833008 257 L 294.833008 231" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2004455164-3488378134)" mask="url(#d2-2004455164)" /><text x="177.5" y="371" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">work order naming room and fault [BuildSim alert]</text></g><g class="KHRlY2ggLSZndDsgc3lzKVswXQ=="><path d="M 358.165985 229 L 358.165985 257 S 358.165985 267 368.165985 267 L 465.5 267 S 475.5 267 475.5 277 L 475.5 404" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2004455164-3488378134)" mask="url(#d2-2004455164)" /><text x="467.5" y="273" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">repairs, which clears the latched case</text></g><g class="KHN5cyAtJmd0OyBicylbMF0="><path d="M 475.5 556 L 475.5 743" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2004455164-3488378134)" mask="url(#d2-2004455164)" /><text x="476" y="640" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="476" dy="0">reads sensor values and actuator state, commands</tspan><tspan x="476" dy="17.666667">actuators, publishes room layers and alerts — every</tspan><tspan x="476" dy="17.666667">exchange initiated here, BuildSim never calls in [REST]</tspan></text></g><mask id="d2-2004455164" maskUnits="userSpaceOnUse" x="-88" y="-89" width="1024" height="1051">
