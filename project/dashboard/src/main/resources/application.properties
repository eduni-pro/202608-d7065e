# Every dependency is optional: an unset URL disables that capability and leaves the HTTP view
# serving, because this is the container an operator looks at to decide whether the rest is alive.
dashboard.broker-url=${BROKER_URL:}
dashboard.buildsim-url=${BUILDSIM_URL:}
dashboard.jdbc-url=${JDBC_URL:}
dashboard.jdbc-user=${JDBC_USER:}
dashboard.jdbc-password=${JDBC_PASSWORD:}

# How often the BuildSim room layers are repainted, and how often the HTML page refreshes.
dashboard.layer-seconds=${LAYER_SECONDS:5}
dashboard.layer-interval=${LAYER_SECONDS:5}s

# Three missed 60 s sample periods. Shorter would flag a single lost MQTT message as a dead room;
# longer would let a dead sensor look live for minutes.
dashboard.stale-seconds=${STALE_SECONDS:180}

quarkus.http.port=8080
