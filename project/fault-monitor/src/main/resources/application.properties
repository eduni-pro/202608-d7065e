# The six environment variables docker-compose.yml sets reach the code through MicroProfile
# Config's own env-var mapping (BROKER_URL -> broker.url, CUSUM_K -> cusum.k, and so on), so only
# the scheduler's expression needs a property of its own: @Scheduled wants a duration string, and
# CYCLE_SECONDS is a number.
monitor.cycle=${CYCLE_SECONDS:60}s

quarkus.application.name=fault-monitor

# Raising the fan or stepping a damper is somebody else's job; this component only listens and
# reports, so there is no HTTP surface but the health endpoints.
quarkus.http.port=8080
